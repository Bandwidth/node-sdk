name: Deploy SDK

on:
  release:
    types:
      - published

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Deploy SDK to NPM
    runs-on: ubuntu-latest

    steps:
      - name: Set Release Version
        run: |
          RELEASE_VERSION=${TAG#v}
          if [[ $RELEASE_VERSION =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)?$ ]]; then
            echo "PACKAGE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV
          else
            echo 'Tag does not match expected semver regex pattern (^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)?$)'
            echo $RELEASE_VERSION
            echo 'Please update your tag to match the expected regex pattern'
            exit 1
          fi
        env:
          TAG: ${{ github.event.release.tag_name }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Generate SDK with Updated Version
        run: bash generate.sh --additional-properties=npmVersion=$PACKAGE_VERSION

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Update NPM
        run: npm install -g npm@latest

      - name: Install Packages and Test
        run: |
          yarn
          npm install -g @stoplight/prism-cli
          prism mock ./bandwidth.yml & yarn test-unit
        shell: bash
        env:
          NODE_AUTH_TOKEN: DUMMY_TOKEN

      - name: Publish npm Package
        run: |
          npm version $PACKAGE_VERSION --no-git-tag-version
          npm publish --access public

      - uses: Bandwidth/build-notify-slack-action@v2
        if: always()
        with:
          job-status: ${{ job.status }}
          slack-bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          slack-channel: ${{ secrets.SLACK_CHANNEL }}
